<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget 2027 – Sådan fordeles pengene | Sønderborg Kommune</title>
<style>
  :root {
    --ink: #1f2a33;
    --ink-soft: #55626c;
    --rule: #dfe4e8;
    --paper: #ffffff;
    --blue: #1d71b8;
    --bag-ink: #15324d;
    --focus: #1d71b8;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 32px; }

  h1 { font-size: clamp(1.6rem, 3.2vw, 2.1rem); line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.01em; }
  .lead { margin: 0 0 28px; max-width: 62ch; color: var(--ink-soft); }
  .lead strong { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---------- Top: ring + detail ---------- */
  .stage {
    display: grid;
    grid-template-columns: minmax(260px, 400px) minmax(0, 1fr);
    gap: 40px;
    align-items: center;
  }
  .ring-box { position: relative; width: 100%; max-width: 440px; margin: 0 auto; }
  .ring { width: 100%; height: auto; display: block; overflow: visible; }
  .arc { fill: none; cursor: pointer; transition: opacity .25s ease; pointer-events: stroke; }
  .arc-wrap { transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .ring.has-sel .arc { opacity: .28; }
  .ring.has-sel .arc.sel { opacity: 1; }
  .ring .arc.hov { opacity: 1; }
  .center-num { font-weight: 700; font-size: 44px; fill: var(--bag-ink); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .center-sub { font-weight: 600; font-size: 19px; fill: var(--bag-ink); }
  .center-btn { cursor: pointer; }
  .center-btn:focus { outline: none; }
  .center-btn:focus-visible .bag-focus { stroke: var(--focus); }

  .detail { min-height: 300px; }
  .detail[hidden] { display: none; }
  .d-head { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .d-icon { width: 76px; height: 76px; flex: none; }
  .d-icon svg { width: 100%; height: 100%; }
  .d-name { font-size: 1.35rem; line-height: 1.2; margin: 0; font-weight: 700; }
  .d-figs {
    display: flex; flex-wrap: wrap; gap: 12px 40px;
    padding: 16px 0; margin: 0 0 16px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  }
  .d-fig { display: flex; flex-direction: column; }
  .d-fig-lbl { white-space: nowrap; }
  .d-fig-lbl { font-size: .85rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); margin-bottom: 4px; }
  .d-fig b { white-space: nowrap; font-size: 2.6rem; line-height: 1.05; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .d-fig-sub { color: var(--ink-soft); font-size: .95rem; margin-top: 2px; }
  #dMio { color: var(--ink); }
  @media (max-width: 480px) { .d-fig b { font-size: 1.75rem; } .d-figs { gap: 8px 20px; } }
  .coins { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; margin: 0 0 16px; max-width: 420px; }
  .coins i { display: block; aspect-ratio: 1; border-radius: 50%; background: #e7ebee; transition: background .25s ease; }
  .d-text { margin: -4px 0 18px; max-width: 58ch; }
  .subs { margin: 0 0 16px; max-width: 560px; }
  .subs-top span { font-size: .75rem; line-height: 1.2; }
  .subs[hidden] { display: none; }
  .subs-h { font-size: 1rem; margin: 0 0 6px; }
  .subs ul { list-style: none; margin: 0; padding: 0; }
  .subs-top { display: grid; grid-template-columns: 1fr 108px 140px; gap: 12px; align-items: end; margin-bottom: 4px; }
  .subs-top .subs-h { margin: 0; }
  .subs-top span, .subs .s-k { text-align: right; color: var(--ink-soft); font-size: .8rem; }
  .subs li { display: grid; grid-template-columns: 1fr 108px 140px; gap: 4px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--rule); }
  .subs li:last-child { border-bottom: 0; }
  .subs .s-n { font-weight: 600; font-size: .95rem; line-height: 1.25; display: flex; align-items: center; gap: 8px; }
  .subs .s-n i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .subs .s-v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .subs .s-k { font-size: .9rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .subs .s-bar { grid-column: 1 / -1; height: 8px; background: #eef1f3; border-radius: 4px; overflow: hidden; }
  .subs .s-bar i { display: block; height: 100%; border-radius: 4px; }
  .subs .s-note { margin: 6px 0 0; color: var(--ink-soft); font-size: .85rem; }
  .d-meta { margin: 0 0 18px; color: var(--ink-soft); font-size: .95rem; font-variant-numeric: tabular-nums; }
  .pdf {
    display: inline-flex; align-items: center; gap: 10px;
    color: var(--blue); font-weight: 600; text-decoration: underline; text-underline-offset: 3px;
  }
  .pdf:hover { text-decoration-thickness: 2px; }
  .pdf svg { width: 18px; height: 22px; flex: none; }

  .intro-panel p { margin: 0 0 12px; max-width: 46ch; }
  .intro-panel .hint { color: var(--ink-soft); }

  /* ---------- List ---------- */
  .list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 44px 0 8px; }
  h2 { font-size: 1.2rem; margin: 0; }
  .list-head small { color: var(--ink-soft); font-size: .9rem; }
  .areas { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .areas li { border-bottom: 1px solid var(--rule); }
  .row {
    all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
    display: grid; grid-template-columns: 40px minmax(160px, 1.1fr) 2fr 64px;
    align-items: center; gap: 14px; padding: 10px 10px;
    border-radius: var(--radius);
  }
  .row:hover { background: #f4f6f8; }
  .row:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .row[aria-pressed="true"] { background: var(--tint); }
  .row .ic { width: 40px; height: 40px; }
  .row .ic svg { width: 100%; height: 100%; }
  .row .nm { font-weight: 600; line-height: 1.25; }
  .bar { height: 14px; background: #eef1f3; border-radius: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 7px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .pct { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

  .foot { margin-top: 22px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; color: var(--ink-soft); font-size: .92rem; }
  .foot p { margin: 0; max-width: 60ch; }

  .draft { margin: 0 0 16px; padding: 10px 14px; border: 2px dashed #c0392b; border-radius: var(--radius); color: #a93226; font-weight: 700; }
  .draft[hidden] { display: none; }
  .d-text.missing { color: #a93226; font-style: italic; }

  /* ---------- Indlejret i iframe (?embed eller automatisk) ---------- */
  html.embedded .wrap { padding: 4px 3px 12px; max-width: none; }
  html.embedded .draft { margin-top: 0; }
  @media (max-width: 760px) {
    html.embedded .ring-box { max-width: 100%; }
    html.embedded .row { padding: 10px 4px; }
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 900px) {
    .stage { grid-template-columns: 1fr; gap: 20px; }
    .ring-box { max-width: 340px; }
    .detail { min-height: 0; }
    .row { grid-template-columns: 34px 1fr 52px; gap: 10px; }
    .row .ic { width: 34px; height: 34px; }
    .bar { grid-column: 2 / 4; grid-row: 2; height: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .arc, .arc-wrap, .coins i { transition: none; }
  }
  .d-name, .row .nm { min-width: 0; hyphens: auto; overflow-wrap: break-word; }
  .stage > * { min-width: 0; }
  /* Smal plads (mobil ELLER smal iframe): navn på egen linje, beløb og andel under */
  .subs { container-type: inline-size; }
  @container (max-width: 460px) {
    .subs-top { grid-template-columns: 1fr auto; }
    .subs-top span:nth-of-type(1) { display: none; }
    .subs li { grid-template-columns: 1fr auto; gap: 2px 8px; }
    .subs .s-n { grid-column: 1 / -1; }
    .subs .s-v { text-align: left; padding-left: 20px; }
  }
  @media (max-width: 520px) {
    .d-icon { width: 52px; height: 52px; }
    .d-name { font-size: 1.15rem; }
  }
  /* Sikkerhedsnet: aldrig vandret scroll i iframen */
  html, body { overflow-x: clip; }
</style>
<script>
/* Indlejringstilstand: fjerner sidemargen i iframe,  */
(function () {
  var q = new URLSearchParams(location.search), h = document.documentElement;
  if (window.self !== window.top || q.has("embed")) h.classList.add("embedded");
})();
</script>
</head>
<body>
<main class="wrap">
  <p class="draft" id="draft" hidden>UDKAST – tal og tekster er eksempler og skal erstattes</p>

  <section class="stage" aria-label="Fordeling af budgettet">
    <div class="ring-box">
      <svg class="ring" id="ring" viewBox="0 0 420 420" role="img" aria-labelledby="ringLabel">

  <ul class="areas" id="areas"></ul>

  <div class="foot">
    <p id="footnote"></p>
    <a class="pdf" id="kortPdf" target="_blank" rel="noopener"></a>
  </div>
</main>

<script>

  driftMio: 6015.2,

  areas: [
    { id: "social", name: "Social-, Senior- og Handicapudvalget", icon: "social", color: "#6f4686",
      pct: 23, mio: 1481.9, drift: 1467.1, anlaeg: 14.8, text: "Social-, Senior- og Handicapudvalget er ansvarlig for blandt andet socialpædagogisk bistand, beskyttet beskæftigelse og samværs- og aktivitetstilbud, misbrugsbehandling, støtte- og kontaktpersonordninger, særlig støtte efter Serviceloven til voksne, voksenspecialundervisning, praktisk hjælp og personlig pleje, hjemmesygepleje, hjælpemidler til både voksne og børn, institutioner under udvalgets område, fx plejecentre, botilbud og kvindekrisecenter samt uddannelsesområdet for SOSU og ernæringsområdet.", sub: [{ name: "Senior", mio: 962.5 }, { name: "Social – voksne", mio: 518.9 }] },
    { id: "natur", name: "Natur-, Klima- og Miljøudvalget", icon: "natur", color: "#86bc25",
      pct: 1, mio: 149.4, drift: 136.8, anlaeg: 12.6, text: "Natur-, Klima- og Miljøudvalget varetager forvaltningen af kommunens opgaver inden for natur, klima og miljø. Natur-, Klima- og Miljøudvalget er ansvarlig for blandt andet grønne områder og skove, miljølovgivningen, affalds- og spildevandsplaner, vandforsyning, den grønne omstilling og klimatilpasning. Udvalget har desuden den koordinerende rolle i forhold til udviklingen af Kær Vestermark, Naturpark Nordals og Project Zero. Udvalget er bindeleddet til Sønderborg Forsyning.", sub: [{ name: "Veje og trafik", mio: 105.2 }, { name: "Natur, klima og forsyning", mio: 38.3 }, { name: "Kommunale ejendomme", mio: 5.9 }] },

      pct: 9, mio: 189.4, drift: 187.8, anlaeg: 1.7, text: "Sundhed-, Unge- og Forebyggelsesudvalget varetager blandt andet opgaver inden for generel sundhed, forebyggelse og sundhedsfremme samt ungeindsatsen, samarbejdet med frivillige og udviklingen af ungdomsuddannelser i Sønderborg Kommune. Udvalget træffer desuden afgørelser vedrørende tandplejen, sundhedsplejen, sundhedscentrene og sundhedshusene, Ungdommens Uddannelsesvejledning, Ungekoordinatoren, Ungdomsuddannelsen for unge med særlige behov (STU) og Sønderborg Ungdomsråd.", sub: [{ name: "Sundhed og forebyggelse", mio: 109.0 }, { name: "Undervisning", mio: 49.6 }, { name: "Medfinansiering af sundhedsvæsenet", mio: 30.5 }] },

/* ===================================================================== */
const fmt = new Intl.NumberFormat("da-DK");
const fmt1 = new Intl.NumberFormat("da-DK", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const $ = id => document.getElementById(id);
const svgNS = "http://www.w3.org/2000/svg";
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const hasAmounts = BUDGET.areas.every(a => typeof a.mio === "number");
const areas = BUDGET.areas.map(a => {
  const share = hasAmounts ? a.mio / BUDGET.totalMio : a.pct / 100;
  return { ...a,
    share,
    pctShown: hasAmounts ? Math.round(share * 100) : a.pct,
    mioShown: hasAmounts ? a.mio : Math.round(BUDGET.totalMio * a.pct / 100) };
}).sort((a, b) => b.share - a.share);
const shareSum = areas.reduce((s, a) => s + a.share, 0);

function iconSvg(id) {
  const ic = ICONS[id];
  return ic ? `<svg viewBox="${ic.vb}" xmlns="${svgNS}" preserveAspectRatio="xMidYMid meet">${ic.body}</svg>` : "";
}
const pdfGlyph = `<svg viewBox="0 0 18 22" aria-hidden="true"><path d="M1 1h11l5 5v15H1z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 1v5h5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;

/* Mørkner en farve, til den kan læses som tekst på hvid (WCAG 4.5:1) */
function readable(hex) {
  let [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  const lum = (r, g, b) => [r, g, b].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); })
    .reduce((s, v, i) => s + v * [.2126, .7152, .0722][i], 0);
  while (1.05 / (lum(r, g, b) + .05) < 4.5) { r *= .92; g *= .92; b *= .92; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

function talord(n) {
  return ["nul","et","to","tre","fire","fem","seks","syv","otte","ni","ti","elleve","tolv"][n] || String(n);
}

function tint(hex, amt) {
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  /* amt > 0: lysere mod hvid, amt < 0: mørkere */
  return "#" + c.map(v => Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt)).toString(16).padStart(2, "0")).join("");
}
function krAf100(mio) {
  const v = mio / BUDGET.totalMio * 100;
  return v >= 1 ? fmt.format(Math.round(v)) : fmt1.format(v);
}

/* ---------- Tekster ---------- */
$("draft").hidden = !BUDGET.draft;
$("ringLabel").textContent = `Budget ${BUDGET.year}: ${fmt.format(BUDGET.totalMio)} mio. kr. fordelt på udvalg. ` +
  areas.map(a => `${a.name} ${a.pctShown} procent`).join(", ");
$("introText").innerHTML = `Tænk på budgettet som 100 kr. Den største del, <strong>${areas[0].pctShown} kr.</strong>, går til ${areas[0].name}. De tre største udvalg bruger tilsammen <strong>${areas.slice(0,3).reduce((s,a)=>s+a.pctShown,0)} kr.</strong> af hver 100 kr.`;
$("footnote").textContent = hasAmounts
  ? "Procenterne er afrundede til hele tal. Beløbene omfatter både drift og anlæg. Anlæg er opgjort netto, dvs. efter indtægter som fx salg af jord og ejendomme."
  : "Procenterne er afrundede og giver derfor ikke præcis 100 tilsammen. Beløb i mio. kr. er beregnet ud fra procenterne og er cirka-tal.";
$("kortPdf").innerHTML = `${pdfGlyph}<span>Hent hele budget ${BUDGET.year} (PDF)</span>`;
$("kortPdf").href = BUDGET.pdf;

/* ---------- Pengeposen ---------- */
$("bag").setAttribute("viewBox", BAG.vb);
$("bag").innerHTML = BAG.body;

/* ---------- Ringen ---------- */
const CX = 210, CY = 210, R = 160, SW = 72, C = 2 * Math.PI * R, GAP = 2.2; // GAP i px langs buen
const arcsG = $("arcs");
let startAcc = 0;
areas.forEach(a => {
  a.len = (a.share / shareSum) * C;
  a.start = startAcc;
  startAcc += a.len;
  const mid = ((a.start + a.len / 2) / C) * 2 * Math.PI - Math.PI / 2;
  a.dx = Math.cos(mid) * 9; a.dy = Math.sin(mid) * 9;

  const el = document.createElementNS(svgNS, "circle");
  el.setAttribute("cx", CX); el.setAttribute("cy", CY); el.setAttribute("r", R);
  el.setAttribute("class", "arc");
  el.setAttribute("stroke", a.color);
  el.setAttribute("stroke-width", SW);
  el.setAttribute("transform", `rotate(-90 ${CX} ${CY})`);
  el.dataset.id = a.id;
  el.addEventListener("click", () => select(a.id));
  el.addEventListener("mouseenter", () => el.classList.add("hov"));
  el.addEventListener("mouseleave", () => el.classList.remove("hov"));
  const wrap = document.createElementNS(svgNS, "g");
  wrap.setAttribute("class", "arc-wrap");
  wrap.appendChild(el);
  arcsG.appendChild(wrap);
  a.el = el; a.wrap = wrap;
});

function drawArcs(progress) { // progress 0..1
  const upto = progress * C;
  areas.forEach(a => {
    const visible = Math.max(0, Math.min(a.len, upto - a.start) - GAP);
    a.el.setAttribute("stroke-dasharray", `${visible} ${C}`);
    a.el.setAttribute("stroke-dashoffset", -a.start);
  });
}

/* ---------- 100 mønter ---------- */
const coinsEl = $("coins");
for (let i = 0; i < 100; i++) coinsEl.appendChild(document.createElement("i"));

/* ---------- Listen ---------- */
const list = $("areas");
const maxShare = areas[0].share;
areas.forEach(a => {
  const li = document.createElement("li");
  li.innerHTML = `<button class="row" type="button" aria-pressed="false" data-id="${a.id}"
      style="--c:${a.color};--tint:${a.color}1f">
      <span class="ic" aria-hidden="true">${iconSvg(a.icon)}</span>
      <span class="nm">${a.name}</span>
      <span class="bar" aria-hidden="true"><i style="width:${(a.share / maxShare) * 100}%"></i></span>
      <span class="pct">${a.pctShown} %</span>
    </button>`;
  const btn = li.firstElementChild;
  btn.addEventListener("click", () => {
    select(a.id === current ? null : a.id);
    if (current && window.innerWidth <= 760)
      $("ring").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  });
  btn.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const btns = [...list.querySelectorAll(".row")];
      const i = btns.indexOf(btn) + (e.key === "ArrowDown" ? 1 : -1);
      if (btns[i]) btns[i].focus();
    }
  });
  list.appendChild(li);
  a.btn = btn;
});

/* ---------- Valg ---------- */
let current = null;
function select(id) {
  current = id;
  const a = areas.find(x => x.id === id);
  $("ring").classList.toggle("has-sel", !!a);
  areas.forEach(x => {
    const on = x === a;
    x.el.classList.toggle("sel", on);
    x.wrap.style.transform = on && !reduceMotion ? `translate(${x.dx}px, ${x.dy}px)` : "";
    x.btn.setAttribute("aria-pressed", on);
  });

  if (!a) {
    $("cNum").textContent = fmt.format(Math.round(BUDGET.totalMio));
    $("cSub").textContent = "mio. kr.";
    $("introPanel").hidden = false;
    $("detail").hidden = true;
    return;
  }
  $("cNum").textContent = `${a.pctShown} kr.`;
  $("cSub").textContent = "af hver 100 kr.";

  $("introPanel").hidden = true;
  $("detail").hidden = false;
  $("dIcon").innerHTML = iconSvg(a.icon);
  $("dName").textContent = a.name;
  $("dKr").textContent = `${a.pctShown} kr.`;
  $("dKr").style.color = readable(a.color);
  $("dMioLbl").textContent = hasAmounts ? `Budget ${BUDGET.year}` : `Budget ${BUDGET.year} (ca.)`;
  $("dMio").textContent = `${fmt.format(a.mioShown)} mio. kr.`;
  $("dSplit").innerHTML = (typeof a.drift === "number")
    ? `Drift ${fmt1.format(a.drift)} mio. kr.<br>Anlæg ${fmt1.format(a.anlaeg)} mio. kr.${a.anlaeg < 0 ? " (netto)" : ""}`
    : "";
  $("dText").textContent = a.text || "Beskrivelse mangler.";
  $("dText").classList.toggle("missing", !a.text);

  /* Delområder: summen af rækkerne = udvalgets beløb (rest samles i "Øvrige områder") */
  const subs = (a.sub || []).map(s => ({ ...s }));
  const rest = (a.mioShown ?? 0) - subs.reduce((s, x) => s + x.mio, 0);
  if (subs.length && rest >= 5) subs.push({ name: "Øvrige områder", mio: Math.round(rest * 10) / 10 });
  const dark = parseInt(a.color.slice(1, 3), 16) + parseInt(a.color.slice(3, 5), 16) + parseInt(a.color.slice(5, 7), 16) < 200;
  const shades = dark ? [0, .3, .5, .65, .78, .88] : [0, .5, -.35, .72, -.55, .85];
  subs.forEach((s, k) => s.col = tint(a.color, shades[Math.min(k, shades.length - 1)]));
  /* Fordel udvalgets mønter på delområderne (største rest-metode) */
  const n = a.pctShown, pos = subs.reduce((s, x) => s + Math.max(0, x.mio), 0);
  subs.forEach(s => { s.raw = pos ? Math.max(0, s.mio) / pos * n : 0; s.coins = Math.floor(s.raw); });
  let left = n - subs.reduce((s, x) => s + x.coins, 0);
  [...subs].sort((x, y) => (y.raw - y.coins) - (x.raw - x.coins)).forEach(s => { if (left > 0) { s.coins++; left--; } });
  const coinCols = subs.length ? subs.flatMap(s => Array(s.coins).fill(s.col)) : Array(n).fill(a.color);
  [...coinsEl.children].forEach((c, i) => c.style.background = coinCols[i] || "");

  $("subs").hidden = !subs.length;
  $("subList").innerHTML = subs.map(s => `
    <li>
      <span class="s-n"><i style="background:${s.col}"></i>${s.name}</span>
      <span class="s-v">${fmt1.format(s.mio)} mio. kr.</span>
      <span class="s-k">${krAf100(s.mio)} kr. af 100</span>
      <span class="s-bar" aria-hidden="true"><i style="width:${Math.max(0, s.mio) / a.mioShown * 100}%;background:${s.col}"></i></span>
    </li>`).join("");
}

$("centerBtn").addEventListener("click", () => select(null));

/* ---------- Åbningsanimation: ringen folder sig ud fra posen ---------- */
select(null);
if (reduceMotion) {
  drawArcs(1);
} else {
  const dur = 1100, t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 3);
  (function tick(now) {
    const t = Math.min(1, (now - t0) / dur);
    drawArcs(ease(t));
    if (t < 1) requestAnimationFrame(tick);
  })(t0);
}

/* ---------- Højde til iframe (sendes til siden, der indlejrer) ---------- */
/* Måler selve indholdet (ikke vinduet), så iframen også kan krympe */
if (window.parent !== window && "ResizeObserver" in window) {
  const main = document.querySelector("main");
  let last = 0;
  const send = () => {
    const h = Math.ceil(main.getBoundingClientRect().bottom + window.scrollY);
    if (Math.abs(h - last) > 1) {
      last = h;
      window.parent.postMessage({ type: "sk-budget-height", height: h }, "*");
    }
  };
  new ResizeObserver(send).observe(main);
  window.addEventListener("load", send);
}
</script>
